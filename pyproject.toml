[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "llm-sdk",
    "numpy>=2.5.5",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[tool.mypy]
mypy_path = "llm_sdk"

[[tool.mypy.overrides]]
module = "llm_sdk.*"
follow_imports = "silent"
